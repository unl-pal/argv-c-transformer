name: Feature request
description: Propose a new capability or a change to existing pipeline behavior.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What can't you currently do, or what's awkward/wrong about current behavior?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: >
        What you'd like to see. If it touches the filter/transform/verify
        pipeline, note which stage(s) and whether it's a new config option,
        a new consumer, or a change to an existing one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them (optional).
