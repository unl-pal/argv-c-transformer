name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang llvm-dev libclang-dev lld

      # GitHub Actions doesn't support command substitution in env blocks, so we
      # capture the clang resource dir as a step output and reference it below.
      - name: Capture clang resource dir
        id: clang_res
        run: echo "dir=$(clang -print-resource-dir)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -S . -G Ninja

      - name: Build
        run: ninja -C build filter transform full filter_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          CLANG_RESOURCES: ${{ steps.clang_res.outputs.dir }}
