name: Build and Test CMake/Ninja on Multiple Platforms

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test-on-all-OS:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Get Dependencies Ubuntu
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
          sudo apt-get update
          # ModuleImported parameter in PPCallbacks::InclusionDirective requires LLVM >= 19
          # ubuntu-latest (24.04) only ships LLVM 18 by default
          sudo apt-get install -y clang-19 llvm-19 clang-tools-19 \
            libclang-common-19-dev libclang-19-dev libclang1-19 llvm-19-dev \
            libclang-cpp19 libclang-cpp19-dev

      - name: Find LLVM CMake Dir
        id: find-llvm
        run: |
          LLVM_CONFIG_BIN="$(command -v llvm-config-19 || command -v llvm-config)"
          echo "llvm_cmakedir=$("$LLVM_CONFIG_BIN" --cmakedir)" >> "$GITHUB_OUTPUT"
          echo "llvm_libdir=$("$LLVM_CONFIG_BIN" --libdir)" >> "$GITHUB_OUTPUT"
          echo "clang_resources=$(clang-19 -print-resource-dir)" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja \
            -DLLVM_DIR="${{ steps.find-llvm.outputs.llvm_cmakedir }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-L${{ steps.find-llvm.outputs.llvm_libdir }}"

      - name: Build
        run: ninja -C build filter transform full filter_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          CLANG_RESOURCES: ${{ steps.find-llvm.outputs.clang_resources }}
