name: Build and Test CMake/Ninja on Multiple Platforms

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test-on-all-OS:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Get Dependencies Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 clang-tools-18 libclang-common-18-dev libclang-18-dev libclang1-18 llvm-18-dev
      - name: Get Dependencies Mac
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew update
          brew install llvm
      - name: Get Dependencies Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: >
          choco install llvm
      - name: Find LLVM Prefix Path Windows
        id: find-llvm-windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: powershell
        run: |
          $LLVMConfig = Get-Command llvm-config -ErrorAction SilentlyContinue
          if ($LLVMConfig) {
            $LLVMCMakedir = & $LLVMConfig.Path --cmakedir
            $LLVMPrefix = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $LLVMCMakedir))
            Write-Host "LLVM Prefix: $LLVMPrefix"
            "llvm_prefix=$LLVMPrefix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "$LLVMPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Warning "llvm-config command not found on Windows."
            "llvm_prefix=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Find LLVM Prefix Path Unix
        id: find-llvm-unix
        if: ${{ matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            LLVM_PREFIX="$(brew --prefix llvm)"
            echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
            echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
            echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"
            export PATH="$LLVM_PREFIX/bin:$PATH"
          fi
          LLVM_CONFIG_BIN="$(command -v llvm-config-18 || command -v llvm-config || true)"
          if [[ -z "$LLVM_CONFIG_BIN" ]]; then
            echo "Warning: llvm-config command not found on Unix."
            echo "llvm_prefix=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LLVM_CMAKE_DIR="$("$LLVM_CONFIG_BIN" --cmakedir)"
          LLVM_PREFIX="$(cd "$LLVM_CMAKE_DIR/../../.." && pwd)"
          echo "llvm_prefix=$LLVM_PREFIX" >> "$GITHUB_OUTPUT"
      - name: Configure CMake
        # if: ${{ success() }}
        # if: (steps.find-clang-unix.outcome == 'success' && steps.find-clang-windows.outcome == 'skipped') || (steps.find-clang-windows.outcome == 'success' && steps.find-clang-unix.outcome == 'skipped')
        # if: (steps.find-clang-unix.status == 'success' || steps.find-clang-windows.status == 'success')
        shell: bash
        run: |
          echo "${{ steps.find-llvm-windows.outputs.llvm_prefix }}"
          if [[ ! -z "${{ steps.find-llvm-windows.outputs.llvm_prefix }}" ]]; then
            MY_CLANG_PATH="${{ steps.find-llvm-windows.outputs.llvm_prefix }}"
          else
            MY_CLANG_PATH="${{ steps.find-llvm-unix.outputs.llvm_prefix }}"
          fi
          CMAKE_EXTRA_ARGS=""
          if [[ ! -z "$CC" ]]; then
            CMAKE_EXTRA_ARGS="-DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX"
          fi
          cmake -B build -S . -G Ninja -DCMAKE_PREFIX_PATH="$MY_CLANG_PATH" $CMAKE_EXTRA_ARGS
      - name: Build
        run: |
          ninja -C build
      - name: Run Full
        shell: bash
        run: |
          export CLANG_RESOURCES="$(clang -print-resource-dir)"
          ./build/full properties.config
