name: Build and Test CMake/Ninja on Multiple Platforms

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test-on-all-OS:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Get Dependencies Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 clang-tools-19 libclang-common-19-dev libclang-19-dev libclang1-19 llvm-19-dev
      - name: Get Dependencies Mac
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew update
          brew install llvm
      - name: Get Dependencies Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: >
          choco install llvm
      - name: Find LLVM Prefix Path Windows
        id: find-llvm-windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: powershell
        run: |
          $LLVMConfig = Get-Command llvm-config -ErrorAction SilentlyContinue
          if ($LLVMConfig) {
            $LLVMCMakedir = & $LLVMConfig.Path --cmakedir
            $LLVMPrefix = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $LLVMCMakedir))
            Write-Host "LLVM Prefix: $LLVMPrefix"
            Write-Host "LLVM CMake dir: $LLVMCMakedir"
            "llvm_cmakedir=$LLVMCMakedir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "$LLVMPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Warning "llvm-config command not found on Windows."
            "llvm_cmakedir=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Find LLVM Prefix Path Unix
        id: find-llvm-unix
        if: ${{ matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            LLVM_PREFIX="$(brew --prefix llvm)"
            echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
            echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
            echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"
            export PATH="$LLVM_PREFIX/bin:$PATH"
          fi
          LLVM_CONFIG_BIN="$(command -v llvm-config-19 || command -v llvm-config || true)"
          if [[ -z "$LLVM_CONFIG_BIN" ]]; then
            echo "Warning: llvm-config command not found on Unix."
            echo "llvm_cmakedir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LLVM_CMAKE_DIR="$("$LLVM_CONFIG_BIN" --cmakedir)"
          echo "llvm_cmakedir=$LLVM_CMAKE_DIR" >> "$GITHUB_OUTPUT"
      - name: Configure CMake
        # if: ${{ success() }}
        # if: (steps.find-clang-unix.outcome == 'success' && steps.find-clang-windows.outcome == 'skipped') || (steps.find-clang-windows.outcome == 'success' && steps.find-clang-unix.outcome == 'skipped')
        # if: (steps.find-clang-unix.status == 'success' || steps.find-clang-windows.status == 'success')
        shell: bash
        run: |
          if [[ ! -z "${{ steps.find-llvm-windows.outputs.llvm_cmakedir }}" ]]; then
            LLVM_CMAKE_DIR="${{ steps.find-llvm-windows.outputs.llvm_cmakedir }}"
          else
            LLVM_CMAKE_DIR="${{ steps.find-llvm-unix.outputs.llvm_cmakedir }}"
          fi
          echo "Using LLVM_DIR: $LLVM_CMAKE_DIR"
          CMAKE_EXTRA_ARGS=""
          if [[ ! -z "$CC" ]]; then
            LLVM_PREFIX="$(dirname "$(dirname "$CC")")"
            CMAKE_EXTRA_ARGS="-DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX -DCMAKE_CXX_FLAGS=-isystem${LLVM_PREFIX}/include/c++/v1"
          fi
          cmake -B build -S . -G Ninja -DLLVM_DIR="$LLVM_CMAKE_DIR" $CMAKE_EXTRA_ARGS
      - name: Build
        run: |
          ninja -C build
      - name: Run Full
        shell: bash
        run: |
          export CLANG_RESOURCES="$(clang -print-resource-dir)"
          ./build/full properties.config
